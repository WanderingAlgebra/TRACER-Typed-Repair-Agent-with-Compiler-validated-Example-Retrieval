name: TRACER 验证

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit public capsules
        run: python -m leancapsule audit capsules
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Build Lean project
        run: lake build
      - name: Prepare Mathlib dependency project
        shell: bash
        run: bash scripts/setup_mathlib.sh
      - name: Replay public capsules
        run: python -m leancapsule verify capsules
